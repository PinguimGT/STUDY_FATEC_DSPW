<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js</title>
    
    <!-- Alpine.js CDN -->
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.2/dist/cdn.min.js"></script>

    <style>
        /* CSS Nativo */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #1f2937;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }

        nav {
            background-color: #ffffff;
            color: white;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 60m;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.30;
            color: black;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #520066;
            font-size: 1.5rem;
            cursor: pointer;
            display: block;
        }

        .desktop-menu {
            display: none;
            gap: 1.5rem;
            align-items: center;
        }

        .desktop-menu a {
            color: black;
            font-size: 1.0rem;
            font-weight: 700;
            background-color:white;
            text-decoration: none;
            transition: color 0.2s;
        }

        .desktop-menu a:hover {
            color: black;
        }

        .btn-primary {
            background-color: black;
            color: white;
            border: none;
            padding: 0.375rem 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.875rem;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .mobile-menu {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            background-color: black;
            padding: 1rem;
            border-radius: 0.25rem;
        }

        .mobile-menu a {
            color:black;
            text-decoration: none;
            font-size:0.875rem;
        }

        main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        @media (min-width: 768px) {
            .menu-btn {
                display: none;
            }
            .desktop-menu {
                display: flex;
            }
            main {
                padding: 2rem;
            }
        }

        .card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #14001a;
        }

        /* Carrossel */
        .carousel-wrapper {
            position: relative;
            height: 12rem;
            background-color: #000;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .carousel-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.35);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 9999px;
            cursor: pointer;
        }

        .carousel-btn.left { left: 0.5rem; }
        .carousel-btn.right { right: 0.5rem; }

        /* Formulário */
        .form-group-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .form-group-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .input-field {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            outline: none;
            background-color: #f9fafb;
            color: #1f2937;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #374151;
        }

        /* Tabela */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
        }

        th {
            background-color: #d1d5db;
            color: #374151;
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 50;
        }

        .modal-content {
            color: black;
            border-radius: 0.5rem;
            padding: 1.3em;
            max-width: 24rem;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body x-data="{ 
    menuOpen: false, 
    modalOpen: false, 
    activeSlide: 1,
    formData: { nome: '', email: '' }
}">

    <!-- NAV -->
    <nav>
        <div class="nav-container">
            <span class="nav-brand">Alpine.js</span>

            <button @click="menuOpen = !menuOpen" class="menu-btn">☰</button>
            <div class="desktop-menu">
                <a href="#">Início</a>
                <button @click="modalOpen = true" class="btn-primary">1. Abrir Modal</button>
            </div>
        </div>
        
        <!-- Menu Mobile -->
        <div x-show="menuOpen" class="mobile-menu" style="display: none;">
            <a href="#" @click="menuOpen = false">1. Menu</a>
            <button @click="modalOpen = true; menuOpen = false" class="btn-primary" style="text-align: left;">1. Abrir Modal</button>
        </div>
    </nav>

    <main>

        <!-- 2. CARROSSEL / GALERIA DE IMAGENS -->
        <section class="card">
            <h2>2. Carrossel / Galeria</h2>
            <div class="carousel-wrapper">
                <div x-show="activeSlide === 1"><img src="https://images.pexels.com/photos/31308009/pexels-photo-31308009.jpeg" alt="Slide 1"></div>
                <div x-show="activeSlide === 2" style="display: none;"><img src="https://images.pexels.com/photos/31307991/pexels-photo-31307991.jpeg" alt="Slide 2"></div>
                
                <button @click="activeSlide = activeSlide === 1 ? 2 : 1" class="carousel-btn left">❮</button>
                <button @click="activeSlide = activeSlide === 1 ? 2 : 1" class="carousel-btn right">❯</button>
            </div>
        </section>

        <!-- 3. FORMULÁRIO -->
        <section id="formulario" class="card">
            <h2>3. Formulário de Cadastro</h2>
            <p style="color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem;">Insira os dados cadastrais do estudante do Grupo 19.</p>
            
            <form @submit.prevent="alert('Dados enviados com Alpine.js!')">
                <div class="form-group-grid">
                    <div>
                        <label>Nome do Integrante:</label>
                        <input type="text" x-model="formData.nome" required placeholder="Digite o nome completo" class="input-field">
                    </div>
                    <div>
                        <label>E-mail Acadêmico:</label>
                        <input type="email" x-model="formData.email" required placeholder="Ex: nome@escola.com" class="input-field">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="padding: 0.625rem 1.5rem; font-weight: 500; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">Enviar Dados</button>
            </form>
        </section>

        <!-- 4. TABELA -->
        <section class="card">
            <h2>4. Tabela de Alunos Responsiva</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome do Estudante</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>001</td>
                            <td>Ricardo Otávio</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- 5. MODAL -->
    <div x-show="modalOpen" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="font-size: 1.150rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">5. Componente Modal</h3>
            <p style="color: #9ca3af; margin-bottom: 1rem;">Janela ativada</p>
            <button @click="modalOpen = false" class="btn-primary" style="width: 100%; background-color: #1f2937; padding: 0.5rem 0;">Fechar Janela</button>
        </div>
    </div>

</body>
</html>
