<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap CSS -->
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<title>Bootstrap</title>
	    <style>
		 .carousel-item img {
        height: 500px;
        width: 100%;
        object-fit: contain; /* Mostra a foto inteira sem cortar nada */
        background-color: #000; /* Fundo preto para preencher as sobras laterais */
    }
    </style>
</head>
<body class="bg-dark">
	<!-- usando o container fluid -->
	<div class="container-fluid">
		<div class="row">
			<div class="col-6">
				<div id="controle" class="carousel slide" data-ride="carousel">
					<ol class="carousel-indicators">
						<li data-target="#controle" data-slide-to="0"></li>
						<li data-target="#controle" data-slide-to="1"></li>
						<li data-target="#controle" data-slide-to="2"></li>					
					</ol>
					<div class="carousel-inner">
						<div class="carousel-item">
							<img class="d-block w-100" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Madame_Tussauds_London_-_Spider-Man_statue.jpg/1280px-Madame_Tussauds_London_-_Spider-Man_statue.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="">
							<div class="carousel-caption d-none d-md-block">
								<h3>Spider-Man</h3>
							</div>
						</div>
						<div class="carousel-item active">
							<img class="d-block w-100" src="https://upload.wikimedia.org/wikipedia/pt/5/59/Iron_Man_%282020%29.png?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled" alt="">
							<div class="carousel-caption d-none d-md-block">
								<h3>Iron Man</h3>
								<p></p>
							</div>
						</div>
						<div class="carousel-item">
							<img class="d-block w-100" src="https://upload.wikimedia.org/wikipedia/pt/0/07/SonGoku.jpg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled" alt="">
							<div class="carousel-caption d-none d-md-block">
								<h3>Goku</h3>
							</div>
						</div>
					</div>
					<a href="#controle" class="carousel-control-prev" role="button" data-slide="prev">
						<span class="carousel-control-prev-icon"></span>
					</a>
					<a href="#controle" class="carousel-control-next" role="button" data-slide="next">
						<span class="carousel-control-next-icon"></span>
					</a>
				</div>
			</div>
		</div>
	</div>
	<!-- jQuery, Popper.js, Bootstrap JS -->	
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
	<script src="js/bootstrap.min.js"></script>
	<script>
		$('.carousel').carousel({
			interval: 1000
		})
	</script>
</body>
</html>
